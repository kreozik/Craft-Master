name: Craft-Master CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Deps
        run: |
          cd backend
          npm install

      - name: Build Docker Images
        run: |
          docker build -t craft-backend:latest ./backend
          docker build -t craft-frontend:latest ./frontend